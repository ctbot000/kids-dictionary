<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign page_title = page.title | default: site.title %}
<title>{{ page_title }}{% unless page_title contains site.title %} · {{ site.title }}{% endunless %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%96</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fffdf7;
    --fg: #2b2d42;
    --muted: #6b6f80;
    --accent: #d1452a;
    --link: #0b62c4;
    --rule: #efe6d8;
    --card: #ffffff;
    --tint: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d27;
      --fg: #eceef4;
      --muted: #a3a8b8;
      --accent: #ff8a65;
      --link: #7cb4ff;
      --rule: #343849;
      --card: #232634;
      --tint: #2b2f40;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 18px/1.7 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    /* Break Korean lines between words, not inside them. */
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1rem 3rem; }
  a { color: var(--link); }
  header.site { padding: 1rem 0; margin-bottom: 2rem; border-bottom: 2px dashed var(--rule); }
  header.site a { color: var(--accent); font-weight: 700; text-decoration: none; }
  h1 { font-size: clamp(2rem, 1.5rem + 2.5vw, 2.75rem); line-height: 1.2; margin: 0 0 1rem; }
  h2 { color: var(--accent); font-size: 1.3rem; margin: 2rem 0 0.5rem; }
  p, ul, ol { margin: 0 0 1rem; }
  ul, ol { padding-left: 1.5rem; }
  li { margin: 0.3rem 0; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85em;
    background: var(--tint);
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
    margin: 0 0 1.5rem;
  }
  th, td { text-align: left; padding: 0.6rem 1rem; border-bottom: 1px solid var(--rule); }
  th { background: var(--tint); }
  tr:last-child td { border-bottom: 0; }
  td a { font-weight: 700; text-decoration: none; }
  /* A word page: big headword, part of speech under it, big Korean meaning,
     and each example's translation under it without a second bullet. */
  .word h1 { font-size: clamp(2.75rem, 2rem + 4vw, 4rem); margin-bottom: 0.25rem; }
  .word h1 + p { color: var(--muted); }
  .word h2 + p > strong:only-child { font-size: 1.6rem; }
  .word li > ul { list-style: none; padding-left: 0; margin: 0 0 0.75rem; color: var(--muted); }
  .back { margin-top: 2.5rem; }
  footer.site {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 2px dashed var(--rule);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer.site a { color: inherit; }
</style>
</head>
<body{% if page.path contains "words/" %} class="word"{% endif %}>
<div class="wrap">
  <header class="site">
    <a href="{{ '/' | relative_url }}">📖 {{ site.title }}</a>
  </header>
  <main>
{{ content }}
    {%- if page.path contains "words/" %}
    <p class="back"><a href="{{ '/' | relative_url }}">← All words · 모든 낱말</a></p>
    {%- endif %}
  </main>
  <footer class="site">
    <a href="https://github.com/{{ site.github.repository_nwo | default: 'ctbot000/kids-dictionary' }}">Source on GitHub</a>
  </footer>
</div>
</body>
</html>
